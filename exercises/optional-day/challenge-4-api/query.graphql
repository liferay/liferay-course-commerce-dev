# Challenge 4 — GraphQL queries
# Run at: http://localhost:8080/o/graphql

# ── List tickets ──────────────────────────────────────────────────────────────
{
  c {
    tickets(pageSize: 10, sort: "priority:asc") {
      items {
        id
        externalReferenceCode
        subject
        description
        priority {
          key
          name
        }
        ticketStatus {
          key
          name
        }
      }
      totalCount
    }
  }
}

